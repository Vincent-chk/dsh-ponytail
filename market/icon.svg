<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="Ponytail">
  <title>Ponytail — lazy senior dev mode</title>
  <defs>
    <linearGradient id="ponytail-tail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#15803d"/>
    </linearGradient>
  </defs>
  <g transform="translate(64 64) scale(1.12) translate(-64 -64)">
  <!-- head -->
  <circle cx="45" cy="55" r="18" fill="none" stroke="url(#ponytail-tail)" stroke-width="11"/>
  <!-- the tail: one stroke, tied once -->
  <path d="M59 43C87 33 106 60 93 91" fill="none" stroke="url(#ponytail-tail)" stroke-width="12" stroke-linecap="round"/>
  <!-- hair tie -->
  <rect x="52" y="33" width="16" height="10" rx="5" transform="rotate(-30 60 38)" fill="#14532d"/>
  </g>
</svg>
